                  }

                  addStepButton(
                      "1. Open App Info (Enable 'Allow Restricted Settings' on Android 16)",
                      Color.rgb(71, 85, 105)
                  ) {
                      val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                          data = Uri.fromParts("package", packageName, null)
                      }
                      startActivity(intent)
                  }

                  addStepButton(
                      "2. Grant 'Appear on Top' (Overlay HUD Permission)",
                      Color.rgb(37, 99, 235)
                  ) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivity(intent)
                  }

                  addStepButton(
                      "3. Enable 'Jubeat AutoPlay Gesture Service' in Accessibility",
                      Color.rgb(124, 58, 237)
                  ) {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  addStepButton(
                      "4. Authorize MediaProjection Screen Sync (60/90fps Frame Detector)",
                      Color.rgb(16, 185, 129)
                  ) {
                      startActivity(Intent(this, MediaProjectionRequestActivity::class.java))
                  }

                  addStepButton(
                      "5. Load Beatmap File (.eve / .memon / .json / .txt)",
                      Color.rgb(217, 119, 6)
                  ) {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "*/*"
                      }
                      startActivityForResult(intent, reqPickChartFile)
                  }

                  addStepButton(
                      "6. Show Floating HUD & Launch jubeat plus (v4.4.3)",
                      Color.rgb(225, 29, 72)
                  ) {
                      val svc = JubeatAccessibilityService.instance
                      if (svc == null) {
                          Toast.makeText(this, "Enable Accessibility Service first (Step 3)!", Toast.LENGTH_LONG).show()
                          return@addStepButton
                      }
                      val text = chartPreviewInput.text.toString()
                      if (text.isNotBlank()) {
                          svc.loadChart(text, "EditorChart")
                      }
                      svc.showFloatingHud()

                      val launchIntent = packageManager.getLaunchIntentForPackage("com.konami.android.jubeat")
                      if (launchIntent != null) {
                          startActivity(launchIntent)
                      } else {
                          Toast.makeText(this, "Floating HUD active! Switch to jubeat plus.", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val editorLabel = TextView(this).apply {
                      text = "Loaded Chart Data (.eve / .memon / .json / .txt) — Editable inline:"
                      setTextColor(Color.LTGRAY)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                      setPadding(0, 16, 0, 8)
                  }
                  root.addView(editorLabel)

                  chartPreviewInput = EditText(this).apply {
                      setText(SampleCharts.BUILTIN_SAMPLE_EVE)
                      setTextColor(Color.rgb(226, 232, 240))
                      setBackgroundColor(Color.rgb(30, 41, 59))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      minLines = 10
                      setPadding(20, 20, 20, 20)
                  }
                  root.addView(chartPreviewInput)

                  scroll.addView(root)
                  setContentView(scroll)
              }

              override fun onResume() {
                  super.onResume()
                  refreshStatus()
              }

              private fun refreshStatus() {
                  val overlayOk = Settings.canDrawOverlays(this)
                  val accService = JubeatAccessibilityService.instance
                  val mpOk = MediaProjectionSyncService.isCapturing
                  val chart = accService?.currentChart

                  statusBanner.text = buildString {
                      appendLine("• Overlay Permission: ${if (overlayOk) "GRANTED" else "NOT GRANTED"}")
                      appendLine("• Accessibility Service: ${if (accService != null) "ACTIVE" else "INACTIVE"}")
                      appendLine("• MediaProjection Sync: ${if (mpOk) "CAPTURING" else "STANDBY"}")
                      append("• Loaded Chart: ${chart?.title ?: "Default 16-Panel & Hold Test"} (${chart?.notes?.size ?: 22} notes)")
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqPickChartFile && resultCode == Activity.RESULT_OK) {
                      val uri = data?.data ?: return
                      try {
                          val content = contentResolver.openInputStream(uri)?.use { stream ->
                              BufferedReader(InputStreamReader(stream)).readText()
                          } ?: return
                          chartPreviewInput.setText(content)
                          val fileName = uri.lastPathSegment ?: "LoadedChart"
                          val parsed = JubeatAccessibilityService.instance?.loadChart(content, fileName)
                              ?: ChartParser.parseAuto(content, fileName)
                          Toast.makeText(
                              this,
                              "Loaded ${parsed.title} (${parsed.notes.size} notes, BPM ${parsed.bpm.toInt()})",
                              Toast.LENGTH_LONG
                          ).show()
                          refreshStatus()
                      } catch (e: Exception) {
                          Toast.makeText(this, "Error parsing chart: ${e.message}", Toast.LENGTH_LONG).show()
                      }
                  }
              }
          }
          EOF_KT

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jubeat-autoplay-bot-tab-a9plus-apk
          path: app/build/outputs/apk/debug/app-debug.apk
