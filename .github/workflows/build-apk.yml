          find . -maxdepth 6 -not -path '*/.*'

          # Locate or install Android SDK on runner
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Installing Android SDK command-line tools..."
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
            unzip -q cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            rm -f cmdtools.zip
          fi

          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "sdk.dir=$SDK_DIR" > local.properties

          # Accept all Android SDK licenses and ensure platform 34 is installed
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
            set -o pipefail
          fi

          # Locate or install Gradle 8.9
          if ! command -v gradle >/dev/null 2>&1; then
            curl -sSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
            unzip -q gradle.zip -d "$HOME"
            export PATH="$HOME/gradle-8.9/bin:$PATH"
          fi

          gradle assembleDebug --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jubeat-autoplay-bot-tab-a9plus-apk
          path: app/build/outputs/apk/debug/app-debug.apk
