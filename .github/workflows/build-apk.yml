          data class JubeatNote(
              val lane: Int,
              val timeMs: Long,
              val durationMs: Long = 0L,
              val tailChipLane: Int = lane
          ) : Comparable<JubeatNote> {
              val isHold: Boolean get() = durationMs > 0L
              val endTimeMs: Long get() = timeMs + durationMs

              override fun compareTo(other: JubeatNote): Int {
                  val cmp = timeMs.compareTo(other.timeMs)
                  return if (cmp != 0) cmp else lane.compareTo(other.lane)
              }
          }

          data class ParsedChart(
              val title: String,
              val difficulty: String,
              val bpm: Double,
              val notes: List<JubeatNote>,
              val firstMeasureMs: Long = 0L
          )

          object ChartParser {

              fun parseAuto(rawText: String, fileName: String = "Chart"): ParsedChart {
                  val trimmed = rawText.trim()
                  return when {
                      fileName.endsWith(".eve", ignoreCase = true) ||
                          trimmed.lineSequence().any { it.contains(",PLAY") || it.contains(",MEASURE") || it.contains(",HAKU") } ->
                          parseKonamiEve(trimmed, fileName)

                      trimmed.startsWith("{") && trimmed.contains("\"data\"") ->
                          parseMemonJson(trimmed, fileName)

                      trimmed.startsWith("{") || trimmed.startsWith("[") ->
                          parseSimpleJson(trimmed, fileName)

                      else ->
                          parseMemoTxt(trimmed, fileName)
                  }
              }

              fun parseKonamiEve(eveText: String, title: String = "EVE Chart"): ParsedChart {
                  val notes = mutableListOf<JubeatNote>()
                  var initialBpm = 120.0
                  var hasSetInitialBpm = false
                  var firstMeasureMs: Long? = null

                  for (rawLine in eveText.lineSequence()) {
                      val line = rawLine.trim()
                      if (line.isEmpty() || line.startsWith("#") || line.startsWith("//")) continue
                      val parts = line.split(",")
                      if (parts.size < 3) continue

                      val sectorTick = parts[0].trim().toLongOrNull() ?: continue
                      val tag = parts[1].trim().uppercase(Locale.US)
                      val param = parts[2].trim().toLongOrNull() ?: continue
                      val timeMs = ((sectorTick * 1000.0) / 300.0).roundToLong()

                      when (tag) {
                          "TEMPO" -> {
                              if (param > 0L && !hasSetInitialBpm) {
                                  initialBpm = 60_000_000.0 / param.toDouble()
                                  hasSetInitialBpm = true
                              }
                          }
                          "MEASURE" -> {
                              if (firstMeasureMs == null) firstMeasureMs = timeMs
                          }
                          "PLAY" -> {
                              val lane = (param and 0x0FL).toInt()
                              notes.add(JubeatNote(lane = lane, timeMs = timeMs, durationMs = 0L))
                          }
                          "LONG" -> {
                              val lane = (param and 0x0FL).toInt()
                              val chip = ((param shr 4) and 0x0FL).toInt()
                              val durationTicks = param shr 8
                              val durationMs = ((durationTicks * 1000.0) / 300.0).roundToLong().coerceAtLeast(50L)
                              notes.add(JubeatNote(lane = lane, timeMs = timeMs, durationMs = durationMs, tailChipLane = chip))
                          }
                      }
                  }

                  notes.sort()
                  return ParsedChart(
                      title = title.removeSuffix(".eve"),
                      difficulty = "EXT",
                      bpm = initialBpm,
                      notes = notes,
                      firstMeasureMs = firstMeasureMs ?: (notes.firstOrNull()?.timeMs ?: 0L)
                  )
              }

              fun parseMemonJson(jsonText: String, fallbackTitle: String = "Memon Chart"): ParsedChart {
                  val root = JSONObject(jsonText)
                  val meta = root.optJSONObject("metadata")
                  val title = meta?.optString("title", fallbackTitle) ?: root.optString("music", fallbackTitle)
                  val globalBpm = meta?.optDouble("BPM", root.optDouble("BPM", 120.0)) ?: 120.0
                  val globalOffsetSec = meta?.optDouble("offset", root.optDouble("offset", 0.0)) ?: 0.0
                  val baseOffsetMs = (-globalOffsetSec * 1000.0).roundToLong()

                  val dataObj = root.getJSONObject("data")
                  val diffKey = when {
                      dataObj.has("EXT") -> "EXT"
                      dataObj.has("ADV") -> "ADV"
                      dataObj.has("BSC") -> "BSC"
                      else -> dataObj.keys().next()
                  }
                  val chartObj = dataObj.getJSONObject(diffKey)
                  val resolution = chartObj.optDouble("resolution", 240.0).coerceAtLeast(1.0)
                  val notesArr = chartObj.getJSONArray("notes")

                  val notes = mutableListOf<JubeatNote>()
                  val msPerBeat = 60_000.0 / globalBpm

                  for (i in 0 until notesArr.length()) {
                      val nObj = notesArr.getJSONObject(i)
                      val lane = nObj.getInt("n").coerceIn(0, 15)
                      val rawT = nObj.getDouble("t")
                      val rawL = nObj.optDouble("l", 0.0)
                      val beats = if (rawT >= resolution && !nObj.has("beats")) rawT / resolution else rawT
                      val holdBeats = if (rawL >= resolution && !nObj.has("beats")) rawL / resolution else rawL

                      val timeMs = (baseOffsetMs + beats * msPerBeat).roundToLong().coerceAtLeast(0L)
                      val durationMs = (holdBeats * msPerBeat).roundToLong().coerceAtLeast(0L)
                      notes.add(JubeatNote(lane = lane, timeMs = timeMs, durationMs = durationMs))
                  }

                  notes.sort()
                  return ParsedChart(title, diffKey, globalBpm, notes, notes.firstOrNull()?.timeMs ?: 0L)
              }

              fun parseSimpleJson(jsonText: String, fallbackTitle: String = "Custom Chart"): ParsedChart {
                  val notes = mutableListOf<JubeatNote>()
                  var title = fallbackTitle
                  var bpm = 120.0

                  val arr: JSONArray = if (jsonText.trimStart().startsWith("{")) {
                      val obj = JSONObject(jsonText)
                      title = obj.optString("title", fallbackTitle)
                      bpm = obj.optDouble("bpm", 120.0)
                      obj.getJSONArray("notes")
                  } else {
                      JSONArray(jsonText)
                  }

                  for (i in 0 until arr.length()) {
                      val item = arr.getJSONObject(i)
                      val lane = if (item.has("lane")) {
                          item.getInt("lane").coerceIn(0, 15)
                      } else {
                          (item.getInt("panel") - 1).coerceIn(0, 15)
                      }
                      val timeMs = item.getLong("timeMs")
                      val durationMs = item.optLong("durationMs", 0L)
                      notes.add(JubeatNote(lane = lane, timeMs = timeMs, durationMs = durationMs))
                  }

                  notes.sort()
                  return ParsedChart(title, "CUSTOM", bpm, notes, notes.firstOrNull()?.timeMs ?: 0L)
              }

              fun parseMemoTxt(memoText: String, fallbackTitle: String = "Memo Chart"): ParsedChart {
                  var bpm = 120.0
                  var offsetMs = 0L
                  val notes = mutableListOf<JubeatNote>()
                  val symbolToIndex = mapOf(
                      '1' to 1, '2' to 2, '3' to 3, '4' to 4,
                      '5' to 5, '6' to 6, '7' to 7, '8' to 8,
                      '9' to 9, 'a' to 10, 'b' to 11, 'c' to 12,
                      'd' to 13, 'e' to 14, 'f' to 15, 'g' to 16
                  )

                  val gridLines = mutableListOf<String>()
                  var currentBeat = 0.0

                  for (rawLine in memoText.lineSequence()) {
                      val line = rawLine.trim()
                      if (line.startsWith("BPM:", ignoreCase = true) || line.startsWith("t=", ignoreCase = true)) {
                          bpm = line.substringAfter(":").substringAfter("=").trim().toDoubleOrNull() ?: bpm
                          continue
                      }
                      if (line.startsWith("OFFSET:", ignoreCase = true) || line.startsWith("o=", ignoreCase = true)) {
                          offsetMs = line.substringAfter(":").substringAfter("=").trim().toLongOrNull() ?: offsetMs
                          continue
                      }
                      if (line.contains("|")) {
                          gridLines.add(line)
                          if (gridLines.size == 4) {
                              val panelMap = mutableMapOf<Int, MutableList<Int>>()
                              val rhythmTokens = mutableListOf<String>()
                              for (row in 0 until 4) {
                                  val parts = gridLines[row].split("|")
                                  val leftGrid = parts[0].replace(" ", "")
                                  val maxCol = min(4, leftGrid.length)
                                  for (col in 0 until maxCol) {
                                      val ch = leftGrid[col].lowercaseChar()
                                      val sym = symbolToIndex[ch]
                                      if (sym != null) {
                                          panelMap.getOrPut(sym) { mutableListOf() }.add(row * 4 + col)
                                      }
                                  }
                                  if (parts.size >= 2) rhythmTokens.add(parts[1])
                              }
                              for (beatLine in rhythmTokens) {
                                  val subDiv = max(1, beatLine.length)
                                  for (step in beatLine.indices) {
                                      val ch = beatLine[step].lowercaseChar()
                                      val sym = symbolToIndex[ch]
                                      if (sym != null) {
                                          val beatTime = currentBeat + (step.toDouble() / subDiv.toDouble())
                                          val timeMs = offsetMs + (beatTime * (60_000.0 / bpm)).roundToLong()
                                          panelMap[sym]?.forEach { lane ->
                                              notes.add(JubeatNote(lane = lane, timeMs = timeMs, durationMs = 0L))
                                          }
                                      }
                                  }
                                  currentBeat += 1.0
                              }
                              gridLines.clear()
                          }
                      }
                  }

                  notes.sort()
                  return ParsedChart(fallbackTitle, "MEMO", bpm, notes, notes.firstOrNull()?.timeMs ?: 0L)
              }
          }

          data class GridGeometry(
              val screenWidth: Int = 1200,
              val screenHeight: Int = 1920,
              val gridLeft: Float = 36f,
              val gridTop: Float = 696f,
              val gridRight: Float = 1164f,
              val gridBottom: Float = 1824f
          ) {
              val gridWidth: Float get() = gridRight - gridLeft
              val gridHeight: Float get() = gridBottom - gridTop
              val cellWidth: Float get() = gridWidth / 4f
              val cellHeight: Float get() = gridHeight / 4f

              fun getPanelCenter(lane: Int): PointF {
                  val clamped = lane.coerceIn(0, 15)
                  val row = clamped / 4
                  val col = clamped % 4
                  return PointF(
                      gridLeft + (col + 0.5f) * cellWidth,
                      gridTop + (row + 0.5f) * cellHeight
                  )
              }
          }

          data class FingerStrokeSpec(
              val lane: Int,
              val isContinuation: Boolean,
              val willContinue: Boolean
          )

          data class GestureSlice(
              val startTimeMs: Long,
              val durationMs: Long,
              val strokes: List<FingerStrokeSpec>
          )

          object GestureTimelineCompiler {
              const val SHORT_TAP_DURATION_MS = 38L
              const val CHORD_QUANTIZE_MS = 10L
              const val MAX_STROKES = 10

              fun compile(notes: List<JubeatNote>): List<GestureSlice> {
                  if (notes.isEmpty()) return emptyList()

                  val sorted = notes.sorted()
                  val quantized = mutableListOf<JubeatNote>()
                  var clusterAnchorMs = sorted.first().timeMs

                  for (note in sorted) {
                      val alignedStart = if (abs(note.timeMs - clusterAnchorMs) <= CHORD_QUANTIZE_MS) {
                          clusterAnchorMs
                      } else {
                          clusterAnchorMs = note.timeMs
                          note.timeMs
                      }
                      val dur = if (note.isHold) max(note.durationMs, SHORT_TAP_DURATION_MS) else SHORT_TAP_DURATION_MS
                      quantized.add(note.copy(timeMs = alignedStart, durationMs = dur))
                  }

                  val byLane = quantized.groupBy { it.lane }
                  val normalizedIntervals = mutableListOf<JubeatNote>()
                  for ((_, laneNotes) in byLane) {
                      val ordered = laneNotes.sortedBy { it.timeMs }
                      for (i in ordered.indices) {
                          val cur = ordered[i]
                          val nextStart = ordered.getOrNull(i + 1)?.timeMs
                          val maxEnd = if (nextStart != null) max(cur.timeMs + 16L, nextStart - 16L) else cur.endTimeMs
                          val safeEnd = min(cur.endTimeMs, maxEnd)
                          normalizedIntervals.add(cur.copy(durationMs = max(16L, safeEnd - cur.timeMs)))
                      }
                  }

                  val timePoints = TreeSet<Long>()
                  for (interval in normalizedIntervals) {
                      timePoints.add(interval.timeMs)
                      timePoints.add(interval.endTimeMs)
                  }
                  val boundaries = timePoints.toList()
                  val slices = mutableListOf<GestureSlice>()

                  for (i in 0 until boundaries.size - 1) {
                      val sliceStart = boundaries[i]
                      val sliceEnd = boundaries[i + 1]
                      val sliceDur = sliceEnd - sliceStart
                      if (sliceDur <= 0L) continue

                      val activeNotes = normalizedIntervals.filter { note ->
                          note.timeMs <= sliceStart && note.endTimeMs >= sliceEnd
                      }.take(MAX_STROKES)

                      if (activeNotes.isEmpty()) continue

                      val strokeSpecs = activeNotes.map { note ->
                          FingerStrokeSpec(
                              lane = note.lane,
                              isContinuation = note.timeMs < sliceStart,
                              willContinue = note.endTimeMs > sliceEnd
                          )
                      }
                      slices.add(GestureSlice(sliceStart, sliceDur, strokeSpecs))
                  }
                  return slices
              }
          }

          class MediaProjectionSyncService : Service() {

              enum class SyncDetectionMode {
                  FIRST_NOTE_MARKER_APPEAR,
                  START_BANNER_DISAPPEAR
              }

              companion object {
                  private const val CHANNEL_ID = "jubeat_sync_channel"
                  private const val NOTIFICATION_ID = 4430

                  @Volatile
                  var instance: MediaProjectionSyncService? = null

                  @Volatile
                  var isCapturing: Boolean = false
              }

              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var captureThread: HandlerThread? = null
              private var captureHandler: Handler? = null

              @Volatile
              private var isArmedForSync: Boolean = false

              @Volatile
              private var targetFirstNoteLane: Int = 0

              @Volatile
              private var targetFirstNoteTimeMs: Long = 0L

              @Volatile
              var markerApproachLeadMs: Long = 767L

              @Volatile
              var syncMode: SyncDetectionMode = SyncDetectionMode.FIRST_NOTE_MARKER_APPEAR

              private var baselineLuma: Float = -1f
              private var baselineSamples: Int = 0
              private var bannerSeenHighBrightness: Boolean = false

              var onSyncLocked: ((Long) -> Unit)? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  createNotificationChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val notification = buildNotification("MediaProjection Ready for jubeat Auto-Sync")
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }

                  val resultCode = intent?.getIntExtra("resultCode", Activity.RESULT_CANCELED) ?: Activity.RESULT_CANCELED
                  val resultData: Intent? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      intent?.getParcelableExtra("resultData", Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      intent?.getParcelableExtra("resultData")
                  }

                  if (resultCode == Activity.RESULT_OK && resultData != null) {
                      startScreenCapture(resultCode, resultData)
                  }
                  return START_STICKY
              }

              private fun startScreenCapture(resultCode: Int, resultData: Intent) {
                  stopScreenCapture()

                  val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val projection = mpManager.getMediaProjection(resultCode, resultData) ?: return
                  mediaProjection = projection

                  val thread = HandlerThread("JubeatScreenSyncThread").apply { start() }
                  captureThread = thread
                  val handler = Handler(thread.looper)
                  captureHandler = handler

                  projection.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopScreenCapture()
                      }
                  }, handler)

                  val geom = JubeatAccessibilityService.instance?.gridGeometry ?: GridGeometry()
                  val capWidth = geom.screenWidth / 2
                  val capHeight = geom.screenHeight / 2

                  val reader = ImageReader.newInstance(capWidth, capHeight, PixelFormat.RGBA_8888, 3)
                  imageReader = reader

                  reader.setOnImageAvailableListener({ ir ->
                      val image = ir.acquireLatestImage() ?: return@setOnImageAvailableListener
                      try {
                          if (isArmedForSync) {
                              processFrameForSync(image, geom)
                          }
                      } finally {
                          image.close()
                      }
                  }, handler)

                  virtualDisplay = projection.createVirtualDisplay(
                      "JubeatSyncDisplay",
                      capWidth,
                      capHeight,
                      resources.displayMetrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      reader.surface,
                      null,
                      handler
                  )
                  isCapturing = true
              }

              fun armAutoSync(firstNoteLane: Int, firstNoteTimeMs: Long, mode: SyncDetectionMode) {
                  targetFirstNoteLane = firstNoteLane.coerceIn(0, 15)
                  targetFirstNoteTimeMs = firstNoteTimeMs
                  syncMode = mode
                  baselineLuma = -1f
                  baselineSamples = 0
                  bannerSeenHighBrightness = false
                  isArmedForSync = true
              }

              fun disarmAutoSync() {
                  isArmedForSync = false
              }

              private fun processFrameForSync(image: Image, geom: GridGeometry) {
                  val frameTimeNanos = SystemClock.elapsedRealtimeNanos()
                  val plane = image.planes[0]
                  val buffer = plane.buffer
                  val pixelStride = plane.pixelStride
                  val rowStride = plane.rowStride

                  when (syncMode) {
                      SyncDetectionMode.FIRST_NOTE_MARKER_APPEAR -> {
                          val center = geom.getPanelCenter(targetFirstNoteLane)
                          val cx = (center.x / 2f).toInt().coerceIn(8, image.width - 9)
                          val cy = (center.y / 2f).toInt().coerceIn(8, image.height - 9)

                          var totalLuma = 0f
                          var count = 0
                          for (dy in -6..6 step 3) {
                              for (dx in -6..6 step 3) {
                                  val offset = (cy + dy) * rowStride + (cx + dx) * pixelStride
                                  if (offset >= 0 && offset + 2 < buffer.limit()) {
                                      val r = buffer.get(offset).toInt() and 0xFF
                                      val g = buffer.get(offset + 1).toInt() and 0xFF
                                      val b = buffer.get(offset + 2).toInt() and 0xFF
                                      totalLuma += (0.299f * r + 0.587f * g + 0.114f * b)
                                      count++
                                  }
                              }
                          }
                          if (count == 0) return
                          val avgLuma = totalLuma / count

                          if (baselineSamples < 8) {
                              baselineLuma = if (baselineLuma < 0f) avgLuma else (baselineLuma * 0.7f + avgLuma * 0.3f)
                              baselineSamples++
                              return
                          }

                          if (abs(avgLuma - baselineLuma) >= 28.0f) {
                              isArmedForSync = false
                              val currentSongElapsedMs = targetFirstNoteTimeMs - markerApproachLeadMs
                              val computedSongStartNanos = frameTimeNanos - (currentSongElapsedMs * 1_000_000L)
                              onSyncLocked?.invoke(computedSongStartNanos)
                          }
                      }

                      SyncDetectionMode.START_BANNER_DISAPPEAR -> {
                          val cx = (geom.gridLeft + geom.gridWidth * 0.5f).toInt() / 2
                          val cy = (geom.gridTop + geom.gridHeight * 0.5f).toInt() / 2
                          val offset = cy * rowStride + cx * pixelStride
                          if (offset >= 0 && offset + 2 < buffer.limit()) {
                              val r = buffer.get(offset).toInt() and 0xFF
                              val g = buffer.get(offset + 1).toInt() and 0xFF
                              val b = buffer.get(offset + 2).toInt() and 0xFF
                              val luma = 0.299f * r + 0.587f * g + 0.114f * b
                              if (luma > 165f) {
                                  bannerSeenHighBrightness = true
                              } else if (bannerSeenHighBrightness && luma < 75f) {
                                  isArmedForSync = false
                                  onSyncLocked?.invoke(frameTimeNanos)
                              }
                          }
                      }
                  }
              }

              fun stopScreenCapture() {
                  isArmedForSync = false
                  isCapturing = false
                  virtualDisplay?.release()
                  virtualDisplay = null
                  imageReader?.close()
                  imageReader = null
                  mediaProjection?.stop()
                  mediaProjection = null
                  captureThread?.quitSafely()
                  captureThread = null
              }

              override fun onDestroy() {
                  stopScreenCapture()
                  instance = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Jubeat Screen Sync Service",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(text: String): Notification {
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Jubeat AutoPlay Bot")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setOngoing(true)
                      .build()
              }
          }

          class JubeatAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: JubeatAccessibilityService? = null
              }

              private val serviceScope = CoroutineScope(SupervisorJob() + Dispatchers.Default)
              private var playbackJob: Job? = null
              private lateinit var prefs: SharedPreferences

              var gridGeometry: GridGeometry = GridGeometry()
              var currentChart: ParsedChart? = null
              var compiledSlices: List<GestureSlice> = emptyList()

              @Volatile
              var userTimingOffsetMs: Long = 0L

              @Volatile
              var isPlayingChart: Boolean = false

              private var overlayHud: OverlayHudController? = null
              private var calibrationOverlay: GridCalibrationOverlay? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  prefs = getSharedPreferences("jubeat_bot_prefs", Context.MODE_PRIVATE)
                  loadSavedCalibration()
                  loadChart(SampleCharts.BUILTIN_SAMPLE_EVE, "Sample: Evans (EXT).eve")
                  overlayHud = OverlayHudController(this)
                  calibrationOverlay = GridCalibrationOverlay(this)
              }

              fun loadSavedCalibration() {
                  val dm = resources.displayMetrics
                  val sw = min(dm.widthPixels, dm.heightPixels).takeIf { it > 0 } ?: 1200
                  val sh = max(dm.widthPixels, dm.heightPixels).takeIf { it > 0 } ?: 1920

                  val defaultLeft = sw * 0.03f
                  val defaultRight = sw * 0.97f
                  val defaultWidth = defaultRight - defaultLeft
                  val defaultTop = sh * 0.3625f
                  val defaultBottom = defaultTop + defaultWidth

                  gridGeometry = GridGeometry(
                      screenWidth = sw,
                      screenHeight = sh,
                      gridLeft = prefs.getFloat("gridLeft", defaultLeft),
                      gridTop = prefs.getFloat("gridTop", defaultTop),
                      gridRight = prefs.getFloat("gridRight", defaultRight),
                      gridBottom = prefs.getFloat("gridBottom", defaultBottom)
                  )
                  userTimingOffsetMs = prefs.getLong("userTimingOffsetMs", 0L)
              }

              fun saveCalibration(newGeom: GridGeometry) {
                  gridGeometry = newGeom
                  prefs.edit()
                      .putFloat("gridLeft", newGeom.gridLeft)
                      .putFloat("gridTop", newGeom.gridTop)
                      .putFloat("gridRight", newGeom.gridRight)
                      .putFloat("gridBottom", newGeom.gridBottom)
                      .putLong("userTimingOffsetMs", userTimingOffsetMs)
                      .apply()
              }

              fun loadChart(rawContent: String, fileName: String): ParsedChart {
                  val parsed = ChartParser.parseAuto(rawContent, fileName)
                  currentChart = parsed
                  compiledSlices = GestureTimelineCompiler.compile(parsed.notes)
                  overlayHud?.updateChartStatus(parsed, compiledSlices.size)
                  return parsed
              }

              fun showFloatingHud() {
                  overlayHud?.show()
              }

              fun hideFloatingHud() {
                  overlayHud?.hide()
                  calibrationOverlay?.hide()
              }

              fun toggleGridCalibrationOverlay() {
                  val cal = calibrationOverlay ?: return
                  if (cal.isShowing) cal.hide() else cal.show()
              }

              fun armAutoSyncPlayback(): Boolean {
                  val chart = currentChart ?: return false
                  val firstNote = chart.notes.firstOrNull() ?: return false
                  val mpService = MediaProjectionSyncService.instance ?: return false
                  if (!MediaProjectionSyncService.isCapturing) return false

                  stopPlayback()
                  mpService.onSyncLocked = { songStartNanos ->
                      startPlaybackAtAnchor(songStartNanos)
                  }
                  mpService.armAutoSync(
                      firstNoteLane = firstNote.lane,
                      firstNoteTimeMs = firstNote.timeMs,
                      mode = MediaProjectionSyncService.SyncDetectionMode.FIRST_NOTE_MARKER_APPEAR
                  )
                  return true
              }

              fun startPlaybackNow(anchorToFirstNote: Boolean = true) {
                  val chart = currentChart ?: return
                  val firstNoteMs = if (anchorToFirstNote) (chart.notes.firstOrNull()?.timeMs ?: 0L) else 0L
                  val songStartNanos = SystemClock.elapsedRealtimeNanos() - (firstNoteMs * 1_000_000L)
                  startPlaybackAtAnchor(songStartNanos)
              }

              fun startPlaybackAtAnchor(songStartElapsedNanos: Long) {
                  stopPlayback()
                  val slices = compiledSlices
                  if (slices.isEmpty()) return

                  isPlayingChart = true
                  overlayHud?.onPlaybackStateChanged(true)

                  playbackJob = serviceScope.launch {
                      val activeHoldingStrokes = mutableMapOf<Int, GestureDescription.StrokeDescription>()

                      for (slice in slices) {
                          if (!isActive || !isPlayingChart) break

                          val targetFireNanos = songStartElapsedNanos +
                              ((slice.startTimeMs + userTimingOffsetMs) * 1_000_000L)
                          val nowNanos = SystemClock.elapsedRealtimeNanos()
                          val waitMs = (targetFireNanos - nowNanos) / 1_000_000L

                          if (waitMs > 2L) {
                              delay(waitMs - 1L)
                          }
                          while (SystemClock.elapsedRealtimeNanos() < targetFireNanos && isActive) {
                              Thread.yield()
                          }

                          if (SystemClock.elapsedRealtimeNanos() - targetFireNanos > 80_000_000L &&
                              slice.strokes.none { it.willContinue || it.isContinuation }
                          ) {
                              continue
                          }

                          dispatchSlice(slice, activeHoldingStrokes)
                      }

                      isPlayingChart = false
                      overlayHud?.onPlaybackStateChanged(false)
                  }
              }

              private fun dispatchSlice(
                  slice: GestureSlice,
                  activeHoldingStrokes: MutableMap<Int, GestureDescription.StrokeDescription>
              ) {
                  val builder = GestureDescription.Builder()
                  val nextHoldingStrokes = mutableMapOf<Int, GestureDescription.StrokeDescription>()
                  val safeDurationMs = slice.durationMs.coerceIn(16L, 59_000L)
                  var addedCount = 0

                  for (spec in slice.strokes) {
                      val center = gridGeometry.getPanelCenter(spec.lane)
                      val path = Path().apply {
                          moveTo(center.x, center.y)
                          lineTo(center.x + 0.5f, center.y + 0.5f)
                      }

                      val prevStroke = activeHoldingStrokes[spec.lane]
                      val strokeDesc: GestureDescription.StrokeDescription = if (
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                          spec.isContinuation &&
                          prevStroke != null
                      ) {
                          prevStroke.continueStroke(path, 0L, safeDurationMs, spec.willContinue)
                      } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          GestureDescription.StrokeDescription(path, 0L, safeDurationMs, spec.willContinue)
                      } else {
                          GestureDescription.StrokeDescription(path, 0L, safeDurationMs)
                      }

                      builder.addStroke(strokeDesc)
                      addedCount++

                      if (spec.willContinue) {
                          nextHoldingStrokes[spec.lane] = strokeDesc
                      }
                  }

                  activeHoldingStrokes.clear()
                  activeHoldingStrokes.putAll(nextHoldingStrokes)

                  if (addedCount > 0) {
                      dispatchGesture(builder.build(), null, null)
                  }
              }

              fun stopPlayback() {
                  isPlayingChart = false
                  MediaProjectionSyncService.instance?.disarmAutoSync()
                  playbackJob?.cancel()
                  playbackJob = null
                  overlayHud?.onPlaybackStateChanged(false)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  stopPlayback()
              }

              override fun onDestroy() {
                  stopPlayback()
                  hideFloatingHud()
                  serviceScope.cancel()
                  instance = null
                  super.onDestroy()
              }
          }

          class OverlayHudController(private val service: JubeatAccessibilityService) {

              private val windowManager = service.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val mainHandler = Handler(Looper.getMainLooper())
              private var rootView: View? = null
              private var statusText: TextView? = null
              private var offsetText: TextView? = null
              private var isAdded = false

              fun show() {
                  mainHandler.post {
                      if (isAdded || !Settings.canDrawOverlays(service)) return@post

                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          x = 24
                          y = 36
                      }

                      val container = LinearLayout(service).apply {
                          orientation = LinearLayout.VERTICAL
                          setBackgroundColor(Color.argb(225, 18, 22, 31))
                          setPadding(20, 14, 20, 14)
                      }

                      val titleRow = TextView(service).apply {
                          val chart = service.currentChart
                          text = if (chart != null) {
                              "JubeatBot [${chart.title}] (${chart.notes.size} notes)"
                          } else {
                              "JubeatBot [No Chart Loaded]"
                          }
                          setTextColor(Color.rgb(0, 230, 180))
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      }
                      statusText = titleRow
                      container.addView(titleRow)

                      var initialX = 0
                      var initialY = 0
                      var touchX = 0f
                      var touchY = 0f
                      titleRow.setOnTouchListener { _, ev ->
                          when (ev.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  touchX = ev.rawX
                                  touchY = ev.rawY
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initialX + (ev.rawX - touchX).toInt()
                                  params.y = initialY + (ev.rawY - touchY).toInt()
                                  windowManager.updateViewLayout(container, params)
                                  true
                              }
                              else -> false
                          }
                      }

                      val btnRow = LinearLayout(service).apply {
                          orientation = LinearLayout.HORIZONTAL
                      }

                      fun makeBtn(label: String, bgColor: Int, onClick: () -> Unit): Button {
                          return Button(service).apply {
                              text = label
                              setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                              setTextColor(Color.WHITE)
                              setBackgroundColor(bgColor)
                              minHeight = 0
                              minimumHeight = 0
                              minWidth = 0
                              minimumWidth = 0
                              setPadding(16, 10, 16, 10)
                              setOnClickListener { onClick() }
                          }
                      }

                      btnRow.addView(makeBtn("AUTO-SYNC", Color.rgb(16, 124, 65)) {
                          if (!MediaProjectionSyncService.isCapturing) {
                              val reqIntent = Intent(service, MediaProjectionRequestActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              service.startActivity(reqIntent)
                              Toast.makeText(service, "Grant screen capture, then tap AUTO-SYNC", Toast.LENGTH_SHORT).show()
                          } else if (service.armAutoSyncPlayback()) {
                              statusText?.text = "ARMED: Waiting for 1st Note Marker..."
                          }
                      })

                      btnRow.addView(makeBtn("SYNC 1ST", Color.rgb(0, 110, 210)) {
                          service.startPlaybackNow(anchorToFirstNote = true)
                      })

                      btnRow.addView(makeBtn("STOP", Color.rgb(185, 35, 35)) {
                          service.stopPlayback()
                      })

                      btnRow.addView(makeBtn("-10ms", Color.rgb(55, 65, 81)) {
                          service.userTimingOffsetMs -= 10L
                          service.saveCalibration(service.gridGeometry)
                          updateOffsetLabel()
                      })

                      val offLbl = TextView(service).apply {
                          text = "${service.userTimingOffsetMs}ms"
                          setTextColor(Color.WHITE)
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                          setPadding(10, 10, 10, 10)
                      }
                      offsetText = offLbl
                      btnRow.addView(offLbl)

                      btnRow.addView(makeBtn("+10ms", Color.rgb(55, 65, 81)) {
                          service.userTimingOffsetMs += 10L
                          service.saveCalibration(service.gridGeometry)
                          updateOffsetLabel()
                      })

                      btnRow.addView(makeBtn("4x4 GRID", Color.rgb(124, 58, 237)) {
                          service.toggleGridCalibrationOverlay()
                      })

                      container.addView(btnRow)
                      windowManager.addView(container, params)
                      rootView = container
                      isAdded = true
                  }
              }

              private fun updateOffsetLabel() {
                  val sign = if (service.userTimingOffsetMs >= 0) "+" else ""
                  offsetText?.text = "$sign${service.userTimingOffsetMs}ms"
              }

              fun updateChartStatus(chart: ParsedChart, sliceCount: Int) {
                  mainHandler.post {
                      statusText?.text = "JubeatBot [${chart.title}] (${chart.notes.size} notes / $sliceCount slices)"
                  }
              }

              fun onPlaybackStateChanged(playing: Boolean) {
                  mainHandler.post {
                      val chart = service.currentChart
                      statusText?.text = if (playing) {
                          "PLAYING: ${chart?.title ?: "Chart"} (Tap STOP to abort)"
                      } else {
                          "READY: ${chart?.title ?: "Chart"} (${chart?.notes?.size ?: 0} notes)"
                      }
                  }
              }

              fun hide() {
                  mainHandler.post {
                      if (isAdded && rootView != null) {
                          windowManager.removeView(rootView)
                          rootView = null
                          isAdded = false
                      }
                  }
              }
          }

          class GridCalibrationOverlay(private val service: JubeatAccessibilityService) {

              private val windowManager = service.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val mainHandler = Handler(Looper.getMainLooper())
              private var overlayView: View? = null

              var isShowing: Boolean = false

              fun show() {
                  mainHandler.post {
                      if (isShowing || !Settings.canDrawOverlays(service)) return@post

                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                      }

                      val view = CalibrationCanvasView(service)
                      windowManager.addView(view, params)
                      overlayView = view
                      isShowing = true
                  }
              }

              fun hide() {
                  mainHandler.post {
                      if (isShowing && overlayView != null) {
                          windowManager.removeView(overlayView)
                          overlayView = null
                          isShowing = false
                      }
                  }
              }

              private inner class CalibrationCanvasView(context: Context) : View(context) {
                  private var geom = service.gridGeometry
                  private var draggingTopLeft = false
                  private var draggingBottomRight = false

                  private val gridPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.argb(210, 0, 240, 190)
                      style = Paint.Style.STROKE
                      strokeWidth = 3f
                  }
                  private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.argb(45, 0, 240, 190)
                      style = Paint.Style.FILL
                  }
                  private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE
                      textSize = 34f
                      textAlign = Paint.Align.CENTER
                  }
                  private val tlHandlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.rgb(16, 220, 100)
                      style = Paint.Style.FILL
                  }
                  private val brHandlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.rgb(245, 60, 145)
                      style = Paint.Style.FILL
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      canvas.drawRect(geom.gridLeft, geom.gridTop, geom.gridRight, geom.gridBottom, fillPaint)

                      for (lane in 0 until 16) {
                          val row = lane / 4
                          val col = lane % 4
                          val left = geom.gridLeft + col * geom.cellWidth
                          val top = geom.gridTop + row * geom.cellHeight
                          val right = left + geom.cellWidth
                          val bottom = top + geom.cellHeight

                          canvas.drawRect(left + 4f, top + 4f, right - 4f, bottom - 4f, gridPaint)

                          val center = geom.getPanelCenter(lane)
                          canvas.drawCircle(center.x, center.y, 10f, gridPaint)
                          canvas.drawText("${lane + 1}", center.x, center.y - 18f, textPaint)
                      }

                      canvas.drawCircle(geom.gridLeft, geom.gridTop, 28f, tlHandlePaint)
                      canvas.drawCircle(geom.gridRight, geom.gridBottom, 28f, brHandlePaint)
                  }

                  override fun onTouchEvent(event: MotionEvent): Boolean {
                      val x = event.x
                      val y = event.y
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              val distTl = hypot(x - geom.gridLeft, y - geom.gridTop)
                              val distBr = hypot(x - geom.gridRight, y - geom.gridBottom)
                              if (distTl <= 80f) {
                                  draggingTopLeft = true
                                  return true
                              } else if (distBr <= 80f) {
                                  draggingBottomRight = true
                                  return true
                              }
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (draggingTopLeft) {
                                  geom = geom.copy(
                                      gridLeft = x.coerceIn(0f, geom.gridRight - 200f),
                                      gridTop = y.coerceIn(100f, geom.gridBottom - 200f)
                                  )
                                  service.saveCalibration(geom)
                                  invalidate()
                                  return true
                              } else if (draggingBottomRight) {
                                  geom = geom.copy(
                                      gridRight = x.coerceIn(geom.gridLeft + 200f, width.toFloat()),
                                      gridBottom = y.coerceIn(geom.gridTop + 200f, height.toFloat())
                                  )
                                  service.saveCalibration(geom)
                                  invalidate()
                                  return true
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              draggingTopLeft = false
                              draggingBottomRight = false
                          }
                      }
                      return super.onTouchEvent(event)
                  }
              }
          }

          class MediaProjectionRequestActivity : Activity() {

              private val reqCodeMediaProjection = 4431

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mpManager.createScreenCaptureIntent(), reqCodeMediaProjection)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqCodeMediaProjection && resultCode == RESULT_OK && data != null) {
                      val serviceIntent = Intent(this, MediaProjectionSyncService::class.java).apply {
                          putExtra("resultCode", resultCode)
                          putExtra("resultData", data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                  }
                  finish()
              }
          }

