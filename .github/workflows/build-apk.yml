name: Build Jubeat AutoPlay Bot APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Clean Android Project Files
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/jubeatbot/autoplay app/src/main/res/xml app/src/main/res/values

          cat << 'EOF_SETTINGS' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JubeatAutoPlayBot"
          include(":app")
          EOF_SETTINGS

          cat << 'EOF_ROOT_GRADLE' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_ROOT_GRADLE

          cat << 'EOF_PROPS' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_PROPS

          cat << 'EOF_APP_GRADLE' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.jubeatbot.autoplay"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.jubeatbot.autoplay"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.0.1-tabA9plus"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
